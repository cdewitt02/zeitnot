# Postgres with pgvector, preinstalled.
#
# This container covers the database only. Stockfish is a host install either
# way, and so is Ollama unless you point both providers at a hosted API — see
# the README's Providers section.

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: zeitnot-db
    environment:
      POSTGRES_USER: zeitnot
      POSTGRES_PASSWORD: zeitnot
      POSTGRES_DB: zeitnot
    ports:
      # Override if you already run PostgreSQL on 5432:
      #   ZEITNOT_DB_PORT=5433 docker compose up -d
      - "${ZEITNOT_DB_PORT:-5432}:5432"
    volumes:
      - zeitnot-pgdata:/var/lib/postgresql/data
      # Enables the vector extension on first start, so no psql step is needed.
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      # Ingestion is a long job to start against a database that is not ready.
      test: ["CMD-SHELL", "pg_isready -U zeitnot -d zeitnot"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  zeitnot-pgdata:
