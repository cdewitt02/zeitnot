[project]
name = "zeitnot"
version = "0.1.0"
description = "A chess coach that answers questions about your own games"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "anthropic>=0.40",
    "chess>=1.11",
    "openai>=1.60",
    "pgvector>=0.3.6",
    "prompt-toolkit>=3.0",
    "psycopg[binary,pool]>=3.2",
    "requests>=2.32",
    "rich>=13.9",
    "typer>=0.15",
]

[project.scripts]
zeitnot = "zeitnot.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pyright>=1.1.414",
    "pytest>=8.3",
    "respx>=0.22",
    "responses>=0.25",
    "ruff>=0.9",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zeitnot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

# Strict from the first commit. Gradual typing that is retrofitted never gets
# retrofitted, and a type checker is what is replacing the Go compiler here.
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["zeitnot", "tests"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

# A second checker, not a stricter one. It is here for one rule mypy does not
# implement: PEP 675 `LiteralString`, which is what stops a filter value from
# being concatenated into a SQL string in `zeitnot/search/filters.py`. Verified
# by splicing a value into the WHERE builder — pyright rejects it, mypy 2.3
# reports success — so without this job that guarantee would hold only in an
# editor that happened to have strict mode switched on.
#
# **standard, deliberately not strict.** Strict adds ~70 findings, effectively
# all of them "this vendor SDK's return type is partially unknown" in the three
# LLM adapters, and clearing those means casting at every boundary. The rules
# that catch defects in this codebase are all on at standard.
[tool.pyright]
include = ["zeitnot", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that need Postgres are marked, rather than skipped silently, so a bare
# `pytest` run says what it did not check. No test needs a live Ollama: the
# adapter suite runs against the fakes in `tests/llmtest.py`, deliberately — a
# concrete client would make every consumer of it require a running server.
#
# There was a second marker, `golden`, for tests reading a locally captured
# corpus golden. Those captures were retired in ADR 0003 and everything left in
# `testdata/golden/` is committed, so no test can fail to find its file any
# more and the marker had nothing left to guard.
markers = [
    "corpus: requires a database freshly ingested by the current tree (DATABASE_URL)",
]
