name: Bug report
description: Something behaves differently than documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Setup for this project touches several moving parts, so most reports are
        unanswerable without the environment below. **`zeitnot doctor` answers
        most of it in one command** — paste its output and skip anything it
        already covers.

        **Before filing:** run `zeitnot doctor`, then check
        [docs/troubleshooting.md](https://github.com/cdewitt02/zeitnot/blob/main/docs/troubleshooting.md),
        which covers the failures that look like bugs but aren't — including the
        embedding provider mismatch and the leading-zero month.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
      placeholder: |
        Expected: `zeitnot data analyze me 2026 03` to fetch March games.
        Got: "no games found for user ..."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran, in order.
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Error output
      description: |
        Paste the full message. It is rendered as a code block, so no need to
        format it. **Check it for credentials before posting** — if a database
        URL appears, replace the password.
      render: text

  - type: textarea
    id: doctor
    attributes:
      label: "`zeitnot doctor` output"
      description: |
        Paste the whole thing. It reports the environment file, providers,
        credentials by presence, Stockfish, the database and the index in one
        pass, and it redacts passwords and API keys itself — so it is safe to
        paste as-is, and it answers most of the fields below.
      render: text
    validations:
      required: true

  - type: dropdown
    id: providers
    attributes:
      label: Which providers were selected?
      description: |
        `CHAT_PROVIDER` and `EMBED_PROVIDER`. A hosted API and a local model fail
        in different ways. Skip this if the doctor output above already shows it.
      multiple: true
      options:
        - Chat: ollama (default)
        - Chat: anthropic
        - Chat: openai
        - Embeddings: ollama (default)
        - Embeddings: openai

  - type: input
    id: zeitnot-version
    attributes:
      label: Zeitnot version or commit
      description: "`zeitnot --version`, or the output of `git rev-parse --short HEAD`."
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: "`python --version`"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install it?
      options:
        - uv tool install
        - pipx install
        - editable install (uv pip install -e)
        - other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / macOS 15.2 / Windows 11"
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: How is PostgreSQL running?
      options:
        - docker compose (the bundled docker-compose.yml)
        - native install with pgvector
        - other / managed
    validations:
      required: true

  - type: input
    id: postgres-version
    attributes:
      label: PostgreSQL and pgvector versions
      description: |
        `SELECT version();` and
        `SELECT extversion FROM pg_extension WHERE extname='vector';`
      placeholder: "PostgreSQL 17.2, pgvector 0.8.6"

  - type: input
    id: stockfish
    attributes:
      label: Stockfish version
      description: "`stockfish` then `uci`, or your package manager's version. Only needed for ingestion bugs."
      placeholder: "Stockfish 17"

  - type: input
    id: ollama
    attributes:
      label: Ollama version and models
      description: "Only if you selected Ollama for either role. `ollama --version` and `ollama list`."
      placeholder: "0.5.4 — llama3.2, nomic-embed-text"
