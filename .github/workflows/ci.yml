name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from pyproject.toml and the current release. A port that
        # only works on the developer's interpreter is not a port.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

      # A second checker for one rule mypy does not implement: LiteralString,
      # which is what keeps a filter value out of the SQL text in
      # zeitnot/search/filters.py. Configured at standard mode in
      # pyproject.toml — see the comment there for why not strict.
      - name: pyright
        run: uv run pyright

      - name: pytest
        # The portable subset. The corpus-backed tests need a populated
        # database and locally regenerated goldens, neither of which belongs in
        # CI — see CONTRIBUTING.md.
        run: uv run pytest -m "not corpus" -v
